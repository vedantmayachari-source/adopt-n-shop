{% extends 'base.html' %}

{% block title %}Log In – Adopt n Shop{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <span class="d-inline-flex p-3 rounded-circle text-white mb-2" style="background: linear-gradient(135deg, var(--primary), var(--secondary));">
              <i class="bi bi-shield-lock-fill fs-3"></i>
            </span>
            <h3 class="fw-bold mb-1">Welcome Back</h3>
            <p class="text-muted small">Log in to manage adoptions, orders, and your cart</p>
          </div>

          <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" id="login_email" name="email" value="{{ email or '' }}" class="form-control border-start-0" placeholder="name@example.com" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label class="form-label fw-semibold">Password</label>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                <input type="password" id="login_password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
              </div>
            </div>

            <div class="mb-4 form-check">
              <input type="checkbox" class="form-check-input" id="remember" name="remember">
              <label class="form-check-label small text-muted" for="remember">Remember me on this browser</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </form>

          <!-- Quick Fill Demo Credentials for BCA Examiner / Reviewers -->
          <div class="mt-4 p-3 rounded-3 bg-light border">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <span class="small fw-bold text-dark"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Demo Login Accounts:</span>
            </div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-outline-danger flex-fill" onclick="fillCredentials('admin@adoptnshop.com', 'admin123')">
                <i class="bi bi-shield-shaded me-1"></i> Admin
              </button>
              <button type="button" class="btn btn-sm btn-outline-primary flex-fill" onclick="fillCredentials('rohan@example.com', 'user123')">
                <i class="bi bi-person me-1"></i> Customer
              </button>
            </div>
          </div>

          <div class="text-center mt-4">
            <p class="small text-muted mb-0">
              Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold">Register Now</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function fillCredentials(email, password) {
  document.getElementById('login_email').value = email;
  document.getElementById('login_password').value = password;
}
</script>
{% endblock %}
